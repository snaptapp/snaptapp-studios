<!doctype html>
<!--
  Build-time source for the app-icon PNGs (512 / 192 / 180).
  Not served: this file lives outside public/ on purpose.
  Regenerate per the "Regenerating images" section of ../README.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snaptapp icon source</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 512px;
        height: 512px;
        overflow: hidden;
        background: transparent;
      }
      svg {
        display: block;
        width: 512px;
        height: 512px;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="2" y1="30" x2="30" y2="2" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#22d3ee" />
          <stop offset="0.52" stop-color="#7be0a4" />
          <stop offset="1" stop-color="#ccff00" />
        </linearGradient>
      </defs>
      <!-- Squircle shape: standard 8px corner radius for app icons -->
      <rect x="0" y="0" width="32" height="32" rx="7" ry="7" fill="url(#g)" />
      <g fill="none" stroke="#07080b">
        <circle cx="16" cy="16" r="12.4" stroke-width="1.6" opacity="0.4" />
        <circle cx="16" cy="16" r="8.3" stroke-width="2.7" />
      </g>
      <circle cx="16" cy="16" r="4.2" fill="#07080b" />
    </svg>
  </body>
</html>

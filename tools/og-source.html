<!doctype html>
<!--
  Build-time source for /assets/img/og-default.png (1200x630).
  Not served: this file lives outside public/ on purpose.
  Regenerate with:  node tools/render-assets.mjs
-->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Snaptapp OG source</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 74px 80px;
      background-color: #07080b;
      background-image: radial-gradient(760px 480px at 4% -14%,
          rgba(34, 211, 238, 0.22),
          transparent 60%),
        radial-gradient(620px 420px at 104% 8%, rgba(204, 255, 0, 0.16), transparent 62%),
        radial-gradient(700px 500px at 60% 128%, rgba(168, 85, 247, 0.16), transparent 66%);
      color: #fff;
      font-family: "Inter", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system,
        Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .mark {
      width: 76px;
      height: 76px;
    }

    .name {
      font-size: 44px;
      font-weight: 640;
      letter-spacing: -0.03em;
    }

    .rule {
      flex: 1;
      height: 1px;
      margin-left: 12px;
      background: linear-gradient(90deg, #2c3346, rgba(44, 51, 70, 0));
    }

    h1 {
      font-size: 80px;
      line-height: 1.06;
      font-weight: 640;
      letter-spacing: -0.038em;
      max-width: 21ch;
    }

    .nowrap {
      white-space: nowrap;
    }

    .grad {
      background: linear-gradient(96deg, #22d3ee 0%, #7be0a4 48%, #ccff00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.sub {
      margin-top: 24px;
      font-size: 28px;
      line-height: 1.42;
      color: #c3cadb;
      max-width: 44ch;
    }

    .bottom {
      display: flex;
      align-items: center;
      gap: 28px;
      padding-top: 30px;
      border-top: 1px solid #232838;
      font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
      font-size: 22px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8d95a9;
    }

    .bottom .url {
      color: #fff;
      letter-spacing: 0.04em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-left: auto;
      padding: 10px 20px;
      border: 1px solid rgba(204, 255, 0, 0.42);
      border-radius: 999px;
      background: rgba(204, 255, 0, 0.1);
      color: #ccff00;
      font-size: 20px;
      letter-spacing: 0.11em;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ccff00;
    }
  </style>
</head>

<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="2" y1="30" x2="30" y2="2" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#22d3ee" />
          <stop offset="0.52" stop-color="#7be0a4" />
          <stop offset="1" stop-color="#ccff00" />
        </linearGradient>
      </defs>
      <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="8.5" fill="url(#g)" />
      <g fill="none" stroke="#07080b">
        <circle cx="16" cy="16" r="12.4" stroke-width="1.4" opacity="0.4" />
        <circle cx="16" cy="16" r="8.3" stroke-width="2.3" />
      </g>
      <circle cx="16" cy="16" r="4" fill="#07080b" />
    </svg>
    <span class="name">Snaptapp</span>
    <span class="rule"></span>
  </div>

  <div>
    <h1>
      Games built on
      <span class="grad"><span class="nowrap">real-time</span> edge infrastructure</span>.
    </h1>
    <p class="sub">
      An independent studio. We ship our own games.
    </p>
  </div>

  <div class="bottom">
    <span class="url">snaptapp.us</span>
    <span>Independent studio</span>
    <span class="pill"><span class="dot"></span>More or Less — live</span>
  </div>
</body>

</html>
